@if (image() && !text()) {
  <img
    class="draggable-card card-image"
    [style]="style()"
    [src]="image()"
    alt=""
    cdkDrag
    [cdkDragBoundary]="containerRef()"
    (cdkDragStarted)="onDragStarted()"
    (cdkDragEnded)="onDragEnded($event)"
  />
} @else {
  <div
    class="draggable-card card-text"
    [style]="style()"
    cdkDrag
    [cdkDragBoundary]="containerRef()"
    (cdkDragStarted)="onDragStarted()"
    (cdkDragEnded)="onDragEnded($event)"
  >
    {{ text() }}
  </div>
}
