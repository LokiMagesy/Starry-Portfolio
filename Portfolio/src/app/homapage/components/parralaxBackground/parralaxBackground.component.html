<section class="parallax-section">
  <div class="parallax-container">
    
    <!-- Background Sky -->
    <div class="parallax-layer bg-sky"></div>

    <!-- Mountain Layer 3 -->
    <div 
      class="parallax-layer bg-mountain-3" 
      [style.transform]="'translateY(' + mountain3Y + ')'">
    </div>

    <!-- Planets -->
    <div 
      class="parallax-layer bg-planets" 
      [style.transform]="'translateX(' + planetsX + ')'">
    </div>

    <!-- Mountain Layer 2 -->
    <div 
      class="parallax-layer bg-mountain-2" 
      [style.transform]="'translateY(' + mountain2Y + ')'">
    </div>

    <!-- Mountain Layer 1 -->
    <div 
      class="parallax-layer bg-mountain-1" 
      [style.transform]="'translateY(' + mountain1Y + ')'">
    </div>

  </div>
</section>
